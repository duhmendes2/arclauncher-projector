name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          elif [ -f android/app/keystore.base64 ]; then
            base64 -d android/app/keystore.base64 > android/app/upload-keystore.jks
          fi
          cat <<EOF > android/local.properties
          storeFile=upload-keystore.jks
          storePassword=projectorpass
          keyAlias=upload
          keyPassword=projectorpass
          flutter.versionCode=4126
          flutter.versionName=1.1.5-projector
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number=4126 \
            --build-name=1.1.5-projector

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          find build/app/outputs/flutter-apk -name "app-github-release.apk" -exec cp {} apks/ArcLauncher_Projector_Edition.apk \;
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-projector-apks
          path: apks/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.5-projector
          name: Arc Launcher Projector Edition v1.1.5
          body: |
            ## Arc Launcher: Projector Edition v1.1.5
            - 🛡️ **Correção Crítica de Acessibilidade (Pacote Real com.omeda.arc):** O serviço `ProjectorAccessibilityService` e o `BootReceiver` agora estão no pacote real `com.omeda.arc` e protegidos no ProGuard. O Android agora reconhece e lista "Arc Launcher - Controle do Botão Home" nas Configurações de Acessibilidade.
            - 🚀 **Métodos Nativos na MainActivity:** Todos os botões do topo (Acessibilidade, Configurações do Projetor, Entradas HDMI e Bluetooth) agora contam com handlers dedicados no canal nativo com múltiplos fallbacks para chips Zeasn/MStar/Amlogic.
            - 🎬 **22 Papéis de Parede TMDB Cinema (1080p):** Substituídos todos os links 404 antigos por 22 artes consagradas de cinema com foco e seleção nativos via D-Pad do controle remoto.
            - 📺 **Central do Projetor:** Menu rápido unificado para Home, Iniciar com o Sistema, Keystone/Foco, HDMI e Bluetooth.
            - 🔑 **Chave Criptográfica Permanente Fixada:** Mantém a assinatura idêntica para atualizações transparentes.
          files: |
            apks/ArcLauncher_Projector_Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

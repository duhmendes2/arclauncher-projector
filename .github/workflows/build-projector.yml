name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native Projector Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks
          elif [ -f app/keystore.base64 ]; then
            base64 -d app/keystore.base64 > app/upload-keystore.jks
          fi
          ls -lh app/*.jks || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK Size
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK: $((size / 1024)) KB"

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Native_v2.0.apk
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Edition.apk
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-native-projector-apks
          path: apks/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.7-projector-native
          name: Arc Launcher Projector Edition v2.1.7 (Logo Contorno Splash & Horizontal Borda Top)
          body: |
            ## 🚀 Arc Launcher Projector Edition v2.1.7 (Logo Contorno Splash & Horizontal Borda Top)
            
            ### 🆕 Novidades desta versão:
            - 🌟 **Logo no Topo Oficial:** Aplicado `horizontal_original_borda.png` com escala automática e altura de 34dp no canto superior esquerdo do launcher.
            - 🎬 **Splash Cinematográfica com Logo Contorno:** Apresentação de luxo no centro com `Logo Contorno.png` (260dp) com fade-in e escala sutil ao abrir o sistema.
            - 🌙 **Ícone Vetorial Sleep (Flaticon 835503) & Desligamento Real de Hardware.**
          files: |
            apks/ArcLauncher_Projector_Native_v2.0.apk
            apks/ArcLauncher_Projector_Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

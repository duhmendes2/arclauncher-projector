name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native Projector Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks
          elif [ -f app/keystore.base64 ]; then
            base64 -d app/keystore.base64 > app/upload-keystore.jks
          fi
          ls -lh app/*.jks || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK Size
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK: $((size / 1024)) KB"

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Native_v2.0.apk
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Edition.apk
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-native-projector-apks
          path: apks/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0-projector-native
          name: Arc Launcher Projector Edition v2.0 (Native Ultra-Fast)
          body: |
            ## 🚀 Arc Launcher Projector Edition v2.0 (Native Engine)
            
            Atualização definitiva de altíssimo desempenho baseada no motor nativo ultra-leve do CleanYourTV adaptado para Projetores Android.
            
            ### ⚡ Principais Ganhos de Performance:
            - **Tamanho Reduzido em 99%:** De ~62 MB (Flutter) para **~400 KB** (Java/Views nativas).
            - **Memória RAM Liberada:** Queda de ~120 MB para **~20 MB** de uso de RAM no sistema.
            - **Retorno Instantâneo ao Pressionar Home:** O sistema operacional não encerra mais o launcher por falta de memória RAM ao alternar entre apps pesados (YouTube, Netflix, SmartTube).
            - **Navegação Ultra-Fluida:** D-Pad a 60 FPS com físicas de mola e highlight de vidro flutuante (*GlassView*).
            
            ### 🎬 Recursos Preservados & Novos:
            - **Top Shelf com Ambient Glow Dinâmico:** O topo exibe o nome do app em destaque e reflete um halo luminoso suave com a cor extraída do ícone de cada app.
            - **22 Papéis de Parede TMDB Cinema (1080p):** Seletor nativo integrado direto nas configurações com opção de download imediato ou rotação automática periódica em segundo plano.
            - **Ajustes Rápidos do Projetor:** Atalhos diretos para Keystone, Foco e Calibração de Tela com fallbacks dedicados para chips MStar, Amlogic, Softwinner, Zeasn e WhaleTV.
            - **Entradas de Vídeo (HDMI):** Seletor rápido de HDMI 1, HDMI 2, AV e entradas de TV.
            - **Telemetria na Tela Inicial:** Monitor discreto abaixo do relógio exibindo CPU, Memória RAM Livre e Armazenamento em tempo real.
            - **Auto-Boot & Captura do Botão Home:** Inicia automaticamente ao ligar o projetor (`BootReceiver` e `HomeKeyService`).
            - **Assinatura Oficial Mantida:** Compilado e assinado com a mesma chave criptográfica permanente para atualização direta sem desinstalar.
          files: |
            apks/ArcLauncher_Projector_Native_v2.0.apk
            apks/ArcLauncher_Projector_Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

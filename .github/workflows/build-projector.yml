name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native Projector Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks
          elif [ -f app/keystore.base64 ]; then
            base64 -d app/keystore.base64 > app/upload-keystore.jks
          fi
          ls -lh app/*.jks || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK Size
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK: $((size / 1024)) KB"

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Native_v2.0.apk
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Edition.apk
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-native-projector-apks
          path: apks/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0-projector-native
          name: Arc Launcher Projector Edition v2.1.0 (Pro Features & Calibration)
          body: |
            ## 🚀 Arc Launcher Projector Edition v2.1.0 (Pro Features & Calibration)
            
            ### 🆕 Principais Recursos Implementados:
            - 🎯 **Grade de Calibração de Foco & Keystone:** Tela cheia com padrão milimétrico 16:9, alinhadores de cantos em L, escala de cinza de 10 passos e miradas de teste de foco no centro e nos 4 cantos para ajuste perfeito da lente e do trapézio óptico.
            - ⏱️ **Temporizador de Desligamento (Sleep Timer):** Opções rápidas de 15, 30, 45, 60, 90 e 120 minutos com monitoramento em tempo real e suspensão programada.
            - 📻 **Modo Apenas Áudio / Apagar Projeção:** Apaga totalmente a lâmpada/projeção mantendo Spotify, Bluetooth e músicas de fundo ativas; qualquer toque no controle religa a tela instantaneamente.
            - 🌙 **Descanso de Tela Integrado (Cinema Screensaver):** Relógio minimalista flutuante anti-burnin e slideshow suave de wallpapers de cinema ativável por tempo de inatividade ou manualmente.
            - 🕶️ **Dimmer de Cinema (Filtro Escurecedor):** Camada de escurecimento ajustável (Desativado, 20%, 40%, 60%) para conforto visual absoluto em salas escuras.
            - 🚫 **Gerenciador de Aplicativos (Ocultar Bloatware):** Interface simples para marcar e ocultar aplicativos indesejados de fábrica sem precisar desinstalá-los.
            - 📂 **Seletor de Imagens Locais e Pendrive:** Acesso direto a mídias locais ou catálogo de 22 wallpapers de cinema TMDB em 1080p.
            - ⚡ **Ultra Leve:** Mantém o tamanho mínimo de ~440 KB e consumo ultra baixo de memória RAM (~20 MB).
          files: |
            apks/ArcLauncher_Projector_Native_v2.0.apk
            apks/ArcLauncher_Projector_Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

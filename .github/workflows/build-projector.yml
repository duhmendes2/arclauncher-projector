name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native Projector Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks
          elif [ -f app/keystore.base64 ]; then
            base64 -d app/keystore.base64 > app/upload-keystore.jks
          fi
          ls -lh app/*.jks || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK Size
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK: $((size / 1024)) KB"

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Native_v2.0.apk
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Edition.apk
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-native-projector-apks
          path: apks/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.1-projector-native
          name: Arc Launcher Projector Edition v2.0.1 (Local Wallpaper Picker)
          body: |
            ## 🚀 Arc Launcher Projector Edition v2.0.1
            
            ### 🆕 Novidades desta versão:
            - 📂 **Seletor de Papel de Parede Local / Pendrive:** Adicionado suporte nativo para selecionar e aplicar qualquer imagem armazenada na memória interna do projetor (`Pictures`, `Download`, `DCIM`, `Projetor`) ou em Pendrives USB, além de suporte para abrir o Gerenciador de Arquivos do sistema.
            - 🎬 **Catálogo TMDB 1080p Integrado:** 22 backdrops cinematográficos disponíveis para download imediato ou rotação automática.
            - ⚡ **Desempenho Extremo:** APK de apenas ~430 KB com consumo de ~20 MB de RAM.
          files: |
            apks/ArcLauncher_Projector_Native_v2.0.apk
            apks/ArcLauncher_Projector_Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

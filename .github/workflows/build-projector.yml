name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native Projector Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks
          elif [ -f app/keystore.base64 ]; then
            base64 -d app/keystore.base64 > app/upload-keystore.jks
          fi
          ls -lh app/*.jks || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK Size
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK: $((size / 1024)) KB"

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Native_v2.0.apk
          cp app/build/outputs/apk/release/app-release.apk apks/ArcLauncher_Projector_Edition.apk
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-native-projector-apks
          path: apks/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.2-projector-native
          name: Arc Launcher Projector Edition v2.1.2 (Bettdow AC1066 Native Drivers)
          body: |
            ## 🚀 Arc Launcher Projector Edition v2.1.2 (Bettdow AC1066 Native Drivers)
            
            ### 🆕 Novidades desta versão:
            - 🎯 **Integração de Drivers Nativos do Bettdow AC1066:** Acesso direto aos pacotes de hardware extraídos via ADB:
              - `com.droidlogic.keystone`: Keystone digital oficial da placa Amlogic T5D
              - `com.tpjz.vafocus`: Foco eletrônico e automático nativo do projetor
              - `com.stellamore.bluetoothspeaker`: Modo Caixa de Som Bluetooth com tela apagada
            - ⚡ **Permissões de Sistema Prontas para ADB:** `WRITE_SECURE_SETTINGS`, `DUMP` e `SYSTEM_ALERT_WINDOW`.
          files: |
            apks/ArcLauncher_Projector_Native_v2.0.apk
            apks/ArcLauncher_Projector_Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

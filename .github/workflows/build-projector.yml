name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass projectorpass -keypass projectorpass \
            -dname "CN=ProjectorEdition, OU=Dev, O=DuhMendes, L=SP, S=SP, C=BR"
          cat <<EOF > android/local.properties
          storeFile=upload-keystore.jks
          storePassword=projectorpass
          keyAlias=upload
          keyPassword=projectorpass
          flutter.versionCode=4122
          flutter.versionName=1.1.1-projector
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number=4122 \
            --build-name=1.1.1-projector

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          find build/app/outputs/flutter-apk -name "app-github-release.apk" -exec cp {} apks/ArcLauncher_Projector_Edition.apk \;
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} apks/ \;
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-projector-apks
          path: apks/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.1-projector
          name: Arc Launcher Projector Edition v1.1.1
          body: |
            ## Arc Launcher: Projector Edition v1.1.1
            - 🎮 **Novo Menu "Projetor & Controle Remoto":** Atalho direto para Acessibilidade, Keystone, HDMI e Bluetooth dentro das configurações.
            - 🎬 **Correção de Papéis de Parede:** Suporte completo para seleção e aplicação usando o botão OK / Enter do controle remoto.
            - 🎨 **Splash Screen DUH!:** Logo DUH! FILM & PHOTO exibido em destaque no carregamento do launcher.
            - 🛡️ **Garantia de Aplicação:** Desativação automática de conflitos dia/noite ao escolher artes de cinema.
            - 📡 **Auto-Update OTA:** Compatível com atualizações pela internet sem pendrive.
          files: |
            apks/ArcLauncher_Projector_Edition.apk
            apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

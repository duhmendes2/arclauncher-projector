name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass projectorpass -keypass projectorpass \
            -dname "CN=ProjectorEdition, OU=Dev, O=DuhMendes, L=SP, S=SP, C=BR"
          cat <<EOF > android/local.properties
          storeFile=upload-keystore.jks
          storePassword=projectorpass
          keyAlias=upload
          keyPassword=projectorpass
          flutter.versionCode=4123
          flutter.versionName=1.1.2-projector
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number=4123 \
            --build-name=1.1.2-projector

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          find build/app/outputs/flutter-apk -name "app-github-release.apk" -exec cp {} apks/ArcLauncher_Projector_Edition.apk \;
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-projector-apks
          path: apks/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.2-projector
          name: Arc Launcher Projector Edition v1.1.2
          body: |
            ## Arc Launcher: Projector Edition v1.1.2
            - 🚀 **Correção Crítica de Compatibilidade (32-bit / 64-bit):** O instalador automático agora prioriza exclusivamente o APK Universal compatível com projetores 32-bit ARM (armeabi-v7a).
            - 🎮 **Menu "Projetor & Controle Remoto":** Atalhos para Acessibilidade, Keystone, HDMI e Bluetooth.
            - 🎬 **Papéis de Parede com D-Pad:** Seleção direta usando o botão OK do controle remoto.
            - 🎨 **Splash Screen DUH!:** Logo DUH! FILM & PHOTO no carregamento.
          files: |
            apks/ArcLauncher_Projector_Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

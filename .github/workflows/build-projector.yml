name: Build Projector APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PROJECTOR_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          elif [ -f android/app/keystore.base64 ]; then
            base64 -d android/app/keystore.base64 > android/app/upload-keystore.jks
          fi
          cat <<EOF > android/local.properties
          storeFile=upload-keystore.jks
          storePassword=projectorpass
          keyAlias=upload
          keyPassword=projectorpass
          flutter.versionCode=4125
          flutter.versionName=1.1.4-projector
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number=4125 \
            --build-name=1.1.4-projector

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          find build/app/outputs/flutter-apk -name "app-github-release.apk" -exec cp {} apks/ArcLauncher_Projector_Edition.apk \;
          ls -lh apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclauncher-projector-apks
          path: apks/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.4-projector
          name: Arc Launcher Projector Edition v1.1.4
          body: |
            ## Arc Launcher: Projector Edition v1.1.4
            - 🛡️ **Correção Crítica de Acessibilidade (ProGuard):** As classes do serviço de acessibilidade e boot receiver agora são mantidas no ProGuard, garantindo que o serviço "Arc Launcher - Controle do Botão Home" apareça na lista de Acessibilidade do Android.
            - 🎬 **22 Papéis de Parede Cinematográficos Verificados (1080p):** Substituídas as artes 404 por 22 artes de cinema consagradas (Matrix, Interestelar, Blade Runner, Duna 2, Oppenheimer, etc.) e corrigido foco D-Pad com botão OK.
            - 📺 **Central do Projetor Unificada:** Novo menu em tela cheia com botões grandes e descrições para Controle do Botão Home, Inicialização no Boot, Keystone, HDMI e Bluetooth.
            - 🔑 **Chave Criptográfica Permanente Fixada:** Mantém a mesma assinatura para permitir updates diretos via Wi-Fi.
          files: |
            apks/ArcLauncher_Projector_Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
